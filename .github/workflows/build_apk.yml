name: 构建 Android APK

# 触发条件：推送到 main/master 分支时触发，或在网页端手动点击运行 (workflow_dispatch)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 授予工作流向仓库写入权限，以便初次自动保存签名证书
permissions:
  contents: write

jobs:
  build-apk:
    name: 云端自动编译 Flet APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. 配置 Java JDK 17 (Android 编译工具链所需)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 3.1 锁定固定签名密钥 (若仓库不存在则自动生成并提交入库)
        run: |
          if [ ! -f release.keystore ]; then
            echo ">>> 正在为项目生成永久固定的专属发布密钥 release.keystore ..."
            keytool -genkeypair -v -keystore release.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -alias weightcalendar -dname "CN=WeightCalendar, OU=App, O=Personal, L=Beijing, ST=Beijing, C=CN" \
              -storepass "weight123456" -keypass "weight123456"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add release.keystore
            git commit -m "chore: 永久锁定 Android 发布签名密钥 release.keystore" || true
            git push || true
            echo ">>> 签名密钥生成并提交入库完毕！"
          else
            echo ">>> 检测到已有专属签名密钥 release.keystore，直接复用。"
          fi

      - name: 4. 安装 Python 依赖与 Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli

      - name: 5. 编译生成 Android APK (使用专属固定签名，解决覆盖安装签名不一致)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/release.keystore
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: weight123456
          FLET_ANDROID_SIGNING_KEY_ALIAS: weightcalendar
          FLET_ANDROID_SIGNING_KEY_PASSWORD: weight123456
        run: |
          yes | flet build apk --project "WeightCalendar" --org "com.weight.calendar" \
            --android-signing-key-store "${{ github.workspace }}/release.keystore" \
            --android-signing-key-store-password "weight123456" \
            --android-signing-key-alias "weightcalendar" \
            --android-signing-key-password "weight123456"

      - name: 6. 上传编译产物 APK (供网页直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: WeightCalendar-Android-APK
          path: build/apk/*.apk
          retention-days: 14

      - name: 7. 自动发布到 GitHub Releases (直接下载 APK 安装包，无需解压 zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 提取打包出的 apk 文件并统一重命名为 WeightCalendar.apk
          APK_FILE=$(ls build/apk/*.apk | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" WeightCalendar.apk
            TAG_NAME="v1.0.${{ github.run_number }}"
            # 若已存在则更新附件，否则创建新 Release 发布
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" WeightCalendar.apk --clobber
            else
              gh release create "$TAG_NAME" WeightCalendar.apk \
                --title "体重日历 $TAG_NAME" \
                --notes "📱 **安装包下载**：直接点击下方 Assets 中的 **WeightCalendar.apk** 即可下载安装，无需解压！"
            fi
          fi

