name: 构建 Android APK

# 触发条件：推送到 main/master 分支时触发，或在网页端手动点击运行 (workflow_dispatch)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 云端自动编译 Flet APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. 配置 Java JDK 17 (Android 打包编译链所需)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. 配置 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 5. 安装项目依赖与 Flet CLI 打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli

      - name: 6. 编译生成 Android APK 安装包
        run: |
          flet build apk --project "WeightCalendar" --org "com.weight.calendar"

      - name: 7. 上传编译产物 APK (供网页直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: WeightCalendar-Android-APK
          path: build/apk/*.apk
          retention-days: 14
