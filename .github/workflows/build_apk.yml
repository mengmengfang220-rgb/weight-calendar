name: 构建 Android APK

# 触发条件：推送到 main/master 分支时触发，或在网页端手动点击运行 (workflow_dispatch)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 官方 Flet 自动编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 官方 Flet 自动构建打包 APK (自动配置匹配的 Flutter 与 Android 工具链)
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          build-number: ${{ github.run_number }}

      - name: 3. 上传编译产物 APK (供网页直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: WeightCalendar-Android-APK
          path: ${{ steps.build.outputs.archive-path }}
          retention-days: 14
