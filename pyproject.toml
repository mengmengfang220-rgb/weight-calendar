# ==========================================================
# Flet 移动端项目工程配置文件 (PEP 621 规范)
# 供 Flet CLI 与 GitHub Actions 云端构建自动读取
# ==========================================================

[project]
name = "weight_calendar"
version = "1.0.0"
description = "体重打卡日历应用"
requires-python = ">=3.10"
dependencies = [
    "flet==0.86.5",
    "flet-charts==0.86.5",
]

[tool.flet]
# 应用包名机构标识 (格式: 反向域名)
org = "com.weight"
# 应用显示名称
product = "体重日历"
company = "Personal"

[tool.flet.app]
# 主入口模块与所在路径 (当前根目录下 main.py)
module = "main"
path = "."

[tool.flet.android]
# Android 打包专属配置
package = "com.weight.calendar"
